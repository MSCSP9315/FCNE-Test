name: Build E2C Control PDF
on:
  push:
    branches: [pdf-e2c-control-20261022]
    paths:
      - "tools/build_e2c_catalog.py"
      - ".github/workflows/build-e2c-control-pdf.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow reportlab
      - run: python tools/build_e2c_catalog.py
      - uses: actions/upload-artifact@v4
        with:
          name: e2c-control-pdf
          path: Easy2Coach_Kontrollkatalog_Feld_Halle.pdf
