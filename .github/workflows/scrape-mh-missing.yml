name: Scrape MH Missing
on:
  push:
    branches: [mh-library-scrape-20261115]
    paths:
      - "tools/scrape_mh_missing.py"
      - ".github/workflows/scrape-mh-missing.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python tools/scrape_mh_missing.py
      - uses: actions/upload-artifact@v4
        with:
          name: mh-missing-data
          path: mh_missing.json
