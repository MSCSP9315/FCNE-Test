name: Scrape MH Gratisbuch
on:
  push:
    branches: [mh-library-scrape-20261115]
    paths:
      - "tools/scrape_mh_library.py"
      - ".github/workflows/scrape-mh-library.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python tools/scrape_mh_library.py
      - uses: actions/upload-artifact@v4
        with:
          name: mh-library-data
          path: |
            mh_library.json
            mh_library_report.txt
