<main><h1>🧪 FC NE – v2.32 TEST</h1>

<p><small>Nur Testumgebung. Die normale FC-NE Trainingsapp bleibt unverändert.</small></p></main>
<script>
(async function(){
  const status=document.getElementById('test-load-status');
  try{
    const source='/FCNE/FC_NE_Trainingsapp_E_SFV_Easy2Coach_v2.31_CLEAN.html?base=v231-20261020';
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok)throw new Error('Original-App konnte nicht geladen werden (HTTP '+response.status+')');
    let html=await response.text();
    if(!html.includes('fcne-v21-easy-subbranches') ||
       !html.includes('fcne-v22-spielform-fix') ||
       !html.includes('const E2C='))throw new Error('Die Originaldatei entspricht nicht der erwarteten v2.31 CLEAN.');

      '<script src="/FCNE-Test/swap-ui232.js?build=20261023-button-design-1"><'+'/script>';
    if(!/<\/body>/i.test(html))throw new Error('Die Originaldatei ist unvollständig.');
    html=html.replace(/<\/body>/i,inject+'</body>');
    document.open();document.write(html);document.close();
  }catch(err){
    status.textContent='Test nicht startbar: '+err.message;
    console.error('FCNE Test v2.32',err);
  }
})();
</script>
